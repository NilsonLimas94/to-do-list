<!DOCTYPE html>
<html lang="pt-Br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css">
    <title>Lista de Tarefas</title>
</head>
<body>
    <main>

        <!-- ═══════════════════════════════════════════
             CABEÇALHO
             Dividido em dois lados com Flexbox:
             - Esquerda (.titulos): eyebrow + título principal
             - Direita (.tarefas-concluidas): contador + barra de progresso
             O texto do contador e a largura de .conclusao
             serão atualizados via JavaScript conforme as tarefas forem concluídas.
        ════════════════════════════════════════════ -->
        <div class="cabecalho">

            <!-- Lado esquerdo: rótulo e título da aplicação -->
            <div class="titulos">
                <h1>PRODUTIVIDADE PESSOAL</h1>
                <p>Foco de hoje ✨</p>
            </div>

            <!-- Lado direito: contador de progresso e barra visual -->
            <div class="tarefas-concluidas">
                <!-- ID para atualizar o texto dinamicamente -->
                <span id="texto-progresso">0 de 0 concluídas</span>

                <!-- Trilho cinza da barra de progresso (fundo) -->
                <div class="barra-porcentagem">
                    <!-- Preenchimento colorido — a largura em % representa o progresso -->
                    <!-- ID para alterar a largura da barra roxa via style.width -->
                    <div class="conclusao" id="barra-progresso"></div>
                </div>
            </div>

        </div>
        <!-- /CABEÇALHO -->

        <!-- ═══════════════════════════════════════════
             BARRA DE ADIÇÃO DE TAREFAS
             Contém em uma única linha:
             - Input de texto para digitar a tarefa
             - Select para escolher a categoria/prioridade
             - Botão de confirmação
        ════════════════════════════════════════════ -->
        <div class="barra-pesquisa">
            <div class="input-select-button">

                <!-- Campo de texto onde o usuário digita a nova tarefa -->
                <input type="text" id="input-tarefa" placeholder="O que você precisa realizar hoje?">

                <!-- Grupo Select + Botão agrupados para facilitar o alinhamento com Flexbox -->
                <div class="select-button">

                    <!-- Menu de categorias — o value de cada option será lido pelo JavaScript -->
                    <select name="catergoria" id="categoria">
                        <option value="estudo">📘 Estudo</option>
                        <option value="alta">🔥 Alta</option>
                        <option value="design">🎨 Design</option>
                        <option value="geral">⚡ Geral</option>
                    </select>

                    <!-- Botão de envio — o JavaScript escutará o clique neste elemento -->
                    <button type="button" id="btn-adicionar">Adicionar</button>

                </div>
            </div>
        </div>
        <!-- /BARRA DE ADIÇÃO -->

        <!-- ═══════════════════════════════════════════════════════════
             FILTROS + BOTÃO LIMPAR
             Os botões de filtro serão usados pelo JavaScript para
             mostrar/ocultar tarefas por status (todas, pendentes, concluídas).
             "Limpar" removerá todas as tarefas concluídas de uma vez.
        ════════════════════════════════════════════════════════════ -->
        <div class="filtro-limpar">
            <div class="filtro">
                <button type="button" class="filtro-todas" id="filtro-todas">Todas (3)</button>
                <button type="button" class="filtro-pendentes" id="filtro-pendentes">Pendentes (1)</button>
                <button type="button" class="filtro-concluidas" id="filtro-concluidas">Concluídas (2)</button>
            </div>
            <div class="limpar">
                <button type="button" class="btn-limpar" id="btn-limpar">Limpar</button>
            </div>
        </div>
        <!-- /FILTROS -->

        <!-- ═══════════════════════════════════════════
             LISTA DE TAREFAS
             Cada .tarefa contém: checkbox | texto | tag de categoria | botão excluir.
             Estes itens são estáticos por enquanto (mockup visual).
             O JavaScript irá gerar cada .tarefa dinamicamente ao clicar em "Adicionar".
        ════════════════════════════════════════════ -->
        <div class="historico-tarefa" id="lista-tarefas">
            <!-- As tarefas serão adicionadas aqui dinamicamente via JavaScript -->
        </div>
        <!-- /LISTA DE TAREFAS -->

        <!-- ═══════════════════════════════════════════
             RODAPÉ
             Informações fixas de apoio ao usuário e crédito de tecnologia.
        ════════════════════════════════════════════ -->
        <div class="linha-divisoria-footer"></div>

        <div class="footer">
            <p>Dica: Pressione [ENTER] para salvar rápido</p>
            <p class="texto-direito-footer">Vanilla JS & CSS</p>
        </div>
        <!-- /RODAPÉ -->

    </main>
    <script src="./script.js"></script>
</body>
</html>
